name: CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      DOM_DISABLE_CHROMIUM_SANDBOX: ${{ matrix.os != 'windows-2022' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:browser
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      - run: npm run test:integration
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - if: runner.os == 'Windows'
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
